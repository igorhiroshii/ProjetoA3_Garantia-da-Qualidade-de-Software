[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E701", "E702", "E731", "E741", "B905", "B007", "B904"]       # estilo compacto dos testes e do seed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402", "B011", "B017", "I001"]
"triage/*" = ["E402", "I001"]
"seed/*" = ["E501", "I001"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["sac_omnichannel", "triage"]
omit = ["triage/rodar_avaliacao.py"]

[tool.mutmut]
source_paths = ["triage/triage.py", "sac_omnichannel/cdc.py"]
also_copy = ["triage", "sac_omnichannel", "tests", "pyproject.toml"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q", "-W", "ignore"]
pytest_add_cli_args_test_selection = ["tests/test_a3_triage.py", "tests/test_a3_triage_mutantes.py", "tests/test_cdc_arrependimento.py"]
